name: VolumeCustomizer
options:
  bundleIdPrefix: dev.volumecustomizer
  deploymentTarget:
    macOS: "14.2"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.2"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
targets:
  VolumeCustomizer:
    type: application
    platform: macOS
    sources: [Sources/VolumeCustomizer]
    info:
      path: Sources/VolumeCustomizer/Info.plist
      properties:
        CFBundleDisplayName: Volume Customizer
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        VolumeCustomizerGitHubRepository: Siravitt/Volume-Customizer
        LSUIElement: true
        NSAudioCaptureUsageDescription: Volume Customizer needs to capture other apps' audio so it can change their volume. Audio is processed locally and never recorded or sent anywhere.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.volumecustomizer.VolumeCustomizer
    scheme:
      testTargets: [VolumeCustomizerTests]
  VolumeCustomizerTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/VolumeCustomizerTests]
    dependencies:
      - target: VolumeCustomizer
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/VolumeCustomizer.app/Contents/MacOS/VolumeCustomizer"
        BUNDLE_LOADER: "$(TEST_HOST)"
